<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA_MART — Software Testing Showcase</title>
<meta name="description" content="TOP1_TEAM: a nine-week Nova Mart testing portfolio across static, manual, API, mobile, automation and database testing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05070d; --bg-2:#0a0f1c; --card:#0b101c; --card-2:#101727;
  --text:#f3f5f8; --muted:#9aa4b8; --line:rgba(255,255,255,.14);
  --cyan:#19f0e6; --lime:#c9f03a; --blue:#2b6bff; --coral:#f4655d;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d;--text:#f3f5f8}}
:root[data-theme="dark"]{--bg:#05070d;--text:#f3f5f8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--safe-top) + 90px)}
:root{box-sizing:border-box;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100%;background:
  radial-gradient(900px 500px at 88% -5%,rgba(43,107,255,.16),transparent 60%),
  radial-gradient(700px 420px at -5% 105%,rgba(25,240,230,.08),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
main:focus,main:focus-visible{outline:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(18px,5vw,64px)}

/* header */
header.site{position:sticky;top:var(--safe-top);z-index:20;background:rgba(5,7,13,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.site .wrap{height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
nav.main{display:flex;gap:6px;align-items:center;height:100%}
nav.main a{padding:0 14px;height:100%;display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--muted);position:relative}
nav.main a:hover{color:var(--text)}
nav.main a[aria-current="page"]{color:var(--text)}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--coral)}
.actions{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600}
.pill:hover{border-color:var(--cyan);color:var(--cyan)}
.pill[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px rgba(25,240,230,.25)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:currentColor;border-radius:2px;height:4px}
.pill[aria-pressed="true"] .eq i{animation:eq 1s ease-in-out infinite}
.pill[aria-pressed="true"] .eq i:nth-child(2){animation-delay:.2s}
.pill[aria-pressed="true"] .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.burger{display:none;width:40px;height:38px;border:1px solid var(--line);border-radius:10px;background:transparent}

/* shared */
.bar{width:64px;height:4px;background:var(--coral);border-radius:2px;margin:18px 0 26px}
h1,h2,h3{margin:0;letter-spacing:-.03em}
.page-head{padding:clamp(36px,6vw,72px) 0 8px}
.page-head h1{font-size:clamp(38px,6vw,68px);font-weight:900;line-height:1.02}
.page-head p{color:var(--muted);max-width:52ch;font-size:17px;line-height:1.6;margin:0}
.page-count{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.page-count::before{content:"";width:22px;height:1px;background:var(--muted)}
.glass{--c:var(--cyan);position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 -26px 30px -26px color-mix(in srgb,var(--c) 70%,transparent),0 20px 50px -30px color-mix(in srgb,var(--c) 45%,transparent)}
.btn{--c:var(--cyan);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 34px;border-radius:14px;border:1.5px solid var(--c);color:var(--c);font-weight:700;font-size:17px;background:rgba(255,255,255,.02);box-shadow:0 0 22px -4px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 18px -8px color-mix(in srgb,var(--c) 60%,transparent);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px -2px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 22px -6px color-mix(in srgb,var(--c) 70%,transparent)}
.btn.lime{--c:var(--lime)} .btn.blue{--c:var(--blue)} .btn.coral{--c:var(--coral)}
.ext{width:16px;height:16px}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:clamp(34px,6vw,76px) 0 30px}
.hero h1{font-size:clamp(44px,6.9vw,96px);font-weight:900;line-height:.92;letter-spacing:-.045em}
.hero h2{font-size:clamp(26px,3.6vw,48px);font-weight:700;margin-top:18px;line-height:1.12}
.hero .proj{color:var(--cyan);font-weight:700;font-size:clamp(18px,2.2vw,26px);margin:0 0 30px}
.hero .btns{display:flex;gap:16px;flex-wrap:wrap}
.hero .team-tag{margin-top:26px;color:var(--muted);font-size:14px}
.laptop{perspective:1600px;padding:10px 14px 18px}
.hero>*{min-width:0}
html,body{overflow-x:clip}
.laptop .lid{transform:rotateY(-13deg) rotateX(4deg) rotate(1.5deg);transform-origin:center;border-radius:18px 18px 8px 8px;border:2px solid #2d4fd6;background:#060912;padding:14px;box-shadow:0 0 50px -8px rgba(43,107,255,.55),0 40px 60px -30px #000}
.screen{display:grid;grid-template-columns:34px 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1.55;min-height:230px}
.side{grid-row:1/3;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:12px;color:var(--muted)}
.side i{width:14px;height:14px;border:1.5px solid currentColor;border-radius:4px;opacity:.7}
.w{border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.03);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.w small{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.ring{width:62px;height:62px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--cyan) 0 78%,rgba(255,255,255,.12) 0);display:grid;place-items:center}
.ring::after{content:"";width:46px;height:46px;border-radius:50%;background:#0a0f1c;grid-area:1/1}
.ring svg{grid-area:1/1;z-index:1;width:20px;height:20px;stroke:var(--cyan)}
.ring.lime{background:conic-gradient(var(--lime) 0 100%,transparent 0)}
.ring.lime svg{stroke:var(--lime)}
.spark{width:100%;height:46px}
.bars{display:flex;gap:5px;align-items:flex-end;height:46px}
.bars i{flex:1;background:var(--blue);border-radius:2px;opacity:.9}
.keyboard{height:12px;margin:0 -4%;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#1a2442,#0b1020);box-shadow:0 0 40px -6px rgba(43,107,255,.5)}
.duration{margin-top:clamp(20px,4vw,48px);padding:0 0 50px}
.duration h3{font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--text);margin-bottom:22px}
.track{position:relative;display:grid;grid-template-columns:repeat(9,1fr);max-width:900px}
.track::before{content:"";position:absolute;left:5.5%;right:5.5%;top:8px;height:3px;background:rgba(255,255,255,.14)}
.track::after{content:"";position:absolute;left:5.5%;top:8px;height:3px;width:89%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);transform-origin:left;animation:fill 1.8s .3s cubic-bezier(.6,.1,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.track .wk{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;font-weight:500}
.track .wk i{width:18px;height:18px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:pop .4s both}
.track .wk:nth-child(1) i{animation-delay:.3s}.track .wk:nth-child(2) i{animation-delay:.5s}.track .wk:nth-child(3) i{animation-delay:.7s}.track .wk:nth-child(4) i{animation-delay:.9s}.track .wk:nth-child(5) i{animation-delay:1.1s}.track .wk:nth-child(6) i{animation-delay:1.3s}.track .wk:nth-child(7) i{animation-delay:1.5s}.track .wk:nth-child(8) i{animation-delay:1.7s}.track .wk:nth-child(9) i{animation-delay:1.9s}
@keyframes pop{from{transform:scale(0)}}

/* overview */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;padding:28px 0 20px}
.about p.lead{font-size:20px;line-height:1.6;color:#d6dbe6;max-width:46ch;margin:0 0 28px}
.about b.tn{color:var(--cyan)}
.big{font-size:clamp(70px,10vw,130px);font-weight:900;line-height:.9;color:var(--lime);letter-spacing:-.05em}
.big-sub{font-size:22px;font-weight:700;margin-top:8px}
.big-sub span{display:block;color:var(--cyan)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stat{padding:34px 18px 30px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.stat strong{font-size:clamp(46px,6vw,76px);font-weight:900;line-height:1;color:var(--c)}
.stat span{color:#c9d0de;font-size:17px;line-height:1.4}
.pending{font-size:11px;color:var(--muted);font-weight:500}
.levels{padding:60px 0 30px}
.levels h2{font-size:clamp(32px,5vw,56px);font-weight:900}
.levels p{color:var(--muted);font-size:17px;max-width:46ch;line-height:1.6;margin:0 0 36px}
.lv-labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-bottom:14px}
.lv-labels b{display:block;font-size:19px}.lv-labels span{color:#c9d0de;font-size:15px}
.lv-bar{display:grid;grid-template-columns:repeat(3,1fr);height:62px;border-radius:18px;overflow:hidden}
.lv-bar div:nth-child(1){background:var(--blue);clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%)}
.lv-bar div:nth-child(2){background:var(--lime);margin-left:-2%;clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%,4% 50%)}
.lv-bar div:nth-child(3){background:#26c9b8;margin-left:-2%;clip-path:polygon(4% 50%,0 0,100% 0,100% 100%,0 100%)}
.ticks{display:grid;grid-template-columns:repeat(9,1fr);border-top:2px solid rgba(255,255,255,.5);margin-top:14px;text-align:center}
.ticks span{padding-top:12px;font-weight:700;font-size:15px;position:relative}
.ticks span::before{content:"";position:absolute;top:-8px;left:50%;height:14px;width:2px;background:rgba(255,255,255,.55)}
.center{display:flex;justify-content:center;margin-top:44px}

/* testing */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:34px;position:relative;z-index:1}
.tab{padding:16px 8px 18px;border:1px solid var(--line);border-bottom:2px solid rgba(25,240,230,.65);background:rgba(255,255,255,.03);text-align:center;font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:4px;justify-content:center;transition:background .2s}
.tab:first-child{border-radius:14px 0 0 0}.tab:last-child{border-radius:0 14px 0 0}
.tab small{font-size:11px;font-weight:600}
.tab:hover{background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{color:var(--lime);border-color:var(--lime);border-bottom-color:transparent;background:rgba(201,240,58,.06)}
.panel{--c:var(--lime);margin-top:-1px;border-radius:0 0 18px 18px;border:1px solid var(--lime);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:200px 1fr;gap:clamp(24px,4vw,56px);align-items:center;background:rgba(201,240,58,.025);box-shadow:inset 0 -30px 40px -34px rgba(201,240,58,.45)}
.panel .ico{width:150px;height:150px;color:var(--lime);filter:drop-shadow(0 0 16px rgba(201,240,58,.55));margin:auto}
.panel h2{font-size:clamp(22px,2.6vw,30px);font-weight:800;color:var(--lime);margin-bottom:16px}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.panel li{font-size:17px;line-height:1.5;color:#e4e8f0;padding-left:20px;position:relative;max-width:64ch}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--lime)}
.acts{margin-top:44px}
.acts h3{font-size:clamp(24px,3vw,34px);font-weight:800;margin-bottom:6px}
.acts-list{display:grid;gap:18px;margin-top:22px;max-width:860px}
.act{display:grid;grid-template-columns:200px 1fr 90px;gap:18px;align-items:center;font-size:16px;font-weight:500}
.act .meter{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.act .meter i{display:block;height:100%;background:var(--lime);width:var(--v,0%);border-radius:6px;box-shadow:0 0 12px var(--lime);transition:width .8s}
.act em{font-style:normal;color:var(--muted);font-size:13px;text-align:right}
.results{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.res{padding:24px 18px;text-align:center}
.res small{color:var(--muted);font-weight:600;font-size:13px}.res strong{display:block;font-size:40px;font-weight:900;margin:8px 0 2px;color:var(--c)}
.res p{margin:0;font-size:12px;color:var(--muted)}
.appcard{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:36px;padding:20px 26px}
.appcard small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.appcard strong{font-size:15px;word-break:break-all}

/* team */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px;padding:34px 0 20px}
.mem{display:block}
.mem .pic{position:relative;display:block;aspect-ratio:1.05;border-radius:18px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(160deg,#101a33,#07101a);transition:transform .35s,box-shadow .35s,border-color .35s}
.mem:hover .pic{transform:translateY(-6px);border-color:var(--c);box-shadow:0 24px 50px -24px var(--c)}
.mem .pic svg.sil,.mem .pic img.ph{position:absolute;inset:0;width:100%;height:100%}
.ph{object-fit:cover;display:block}
.pf .pic{position:relative}.pf .pic img.ph{width:100%;height:100%}
.mem .no{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;color:var(--muted)}
.mem .arrow{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--c);color:var(--c);display:grid;place-items:center;background:rgba(5,7,13,.6)}
.badge{position:absolute;left:14px;bottom:14px;background:var(--lime);color:#06100a;font-size:11px;font-weight:800;padding:6px 10px;border-radius:7px;display:flex;gap:6px;align-items:center}
.mem h3{font-size:21px;font-weight:800;margin:16px 0 4px}
.mem p{margin:0;font-size:14px;color:var(--muted)}
.mem p.lead{color:var(--lime);font-weight:600}
.mem:nth-child(3n+1){--c:var(--lime)}.mem:nth-child(3n+2){--c:var(--cyan)}.mem:nth-child(3n){--c:var(--blue)}

/* portfolio */
.back{display:inline-flex;gap:8px;align-items:center;color:var(--cyan);font-weight:600;font-size:14px;margin-top:34px}
.pf{display:grid;grid-template-columns:360px 1fr;gap:clamp(24px,5vw,64px);padding:30px 0}
.pf .pic{aspect-ratio:1;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(160deg,#101a33,#07101a)}
.pf .pic svg{width:100%;height:100%}
.pf h1{font-size:clamp(34px,5vw,60px);font-weight:900;line-height:1.05}
.pf .role{color:var(--lime);font-weight:700;margin:12px 0 4px}
.sec{margin-top:30px}
.sec h2{font-size:24px;font-weight:800;margin-bottom:14px}
.empty{--c:var(--blue);padding:26px;display:flex;gap:16px;align-items:center;color:var(--muted)}
.empty svg{flex:none;color:var(--blue)}

/* thank you */
.ty{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(34px,6vw,70px) 0 30px}
.ty h1{font-size:clamp(40px,6.2vw,88px);font-weight:900;line-height:.98;letter-spacing:-.04em}
.ty h1 b{color:var(--cyan);display:block;text-shadow:0 0 30px rgba(25,240,230,.45)}
.ty .sub{color:#cfd5e2;font-size:18px;line-height:1.6;max-width:36ch;margin:22px 0 0}
.ty .ar{text-align:left;margin:14px 0 0;color:var(--lime);font-size:18px}
figure.refai{margin:0}
figure.refai img{width:100%;height:auto;display:block;border-radius:20px;border:1px solid rgba(201,240,58,.55);box-shadow:0 0 60px -14px rgba(201,240,58,.5)}
figure.refai figcaption{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.6}
.cta3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px 0 60px}
.cta3 a{padding:34px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;transition:transform .2s}
.cta3 a:hover{transform:translateY(-4px)}
.cta3 b{font-size:22px;color:var(--c)}.cta3 span{color:#cfd5e2;line-height:1.5}

footer.site{border-top:1px solid var(--line);margin-top:40px}
footer.site .wrap{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;min-height:84px;color:var(--muted);font-size:14px}
footer.site a.ty-link{color:var(--text);font-weight:700;display:inline-flex;gap:8px;align-items:center}
footer.site a.ty-link:hover{color:var(--cyan)}

@media(max-width:960px){
  .hero,.about,.ty,.pf{grid-template-columns:1fr}
  .laptop{max-width:560px}.laptop .lid{transform:rotateY(-8deg) rotateX(3deg)}
  .team{grid-template-columns:repeat(2,1fr)}
  .tabs{grid-template-columns:repeat(3,1fr)}
  .tab:first-child,.tab:last-child{border-radius:0}.tab:first-child{border-radius:14px 0 0 0}.tab:nth-child(3){border-radius:0 14px 0 0}
  .results{grid-template-columns:repeat(2,1fr)}
  .pf{grid-template-columns:1fr}.pf .pic{max-width:340px}
}
@media(max-width:760px){
  .burger{display:inline-grid;place-items:center}
  nav.main{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;height:auto;background:var(--bg-2);border-bottom:1px solid var(--line);padding:8px clamp(18px,5vw,64px) 14px;display:none}
  nav.main.open{display:flex}
  nav.main a{height:46px;padding:0}
  nav.main a[aria-current="page"]::after{left:0;right:auto;width:28px;bottom:6px}
  .pill span.lbl{display:none}.pill{padding:0 12px}
  .brand small{display:none}
  .track .wk{font-size:9px}.track .wk i{width:13px;height:13px}.track::before,.track::after{top:5px}
  .panel{grid-template-columns:1fr}.panel .ico{width:100px;height:100px;margin:0}
  .act{grid-template-columns:1fr 70px;gap:8px 12px}.act .name{grid-column:1/-1}
  .cta3{grid-template-columns:1fr}
  .stats{gap:12px}.stat{min-height:150px;padding:22px 10px}.stat span{font-size:14px}
  .lv-labels b{font-size:14px}.lv-labels span{font-size:12px}.lv-bar{height:44px}.ticks span{font-size:12px}
}
@media(max-width:480px){.team{gap:26px 14px}.mem h3{font-size:16px}.mem p{font-size:12px}.tab{font-size:13px;padding:12px 4px}.btn{width:100%}.mem .arrow{width:30px;height:30px;right:8px;bottom:8px}.badge{left:8px;bottom:8px;font-size:9px;padding:4px 6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="NOVA_MART home">NOVA_MART<small>TOP1_TEAM</small></a>
    <nav class="main" id="nav" aria-label="Main navigation">
      <a href="#/" data-p="home">Home</a>
      <a href="#/overview" data-p="overview">Overview</a>
      <a href="#/testing" data-p="testing">Testing</a>
      <a href="#/team" data-p="team">The team</a>
    </nav>
    <div class="actions">
      <button class="pill" id="music" aria-pressed="false" aria-label="Play music" title="Play music"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">Music <span id="mstate">off</span></span></button>
      <button class="burger" id="burger" aria-label="Open navigation" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer class="site"><div class="wrap"><a class="brand" href="#/">NOVA_MART</a><span>Software Testing Showcase · Nova Mart</span><a class="ty-link" href="#/thank-you">Thank you <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div></footer>

<script>
/* ============ DATA — edit here ============ */
const APP_URL='https://novamart-pruebatecnica-2.onrender.com/';
const TEAM_NAME='TOP1_TEAM';
const MEMBERS=[
  {name:'Mahmoud abdalnaby',role:'Team leader',leader:true,photo:'assets/mahmoud-abdalnaby.jpg',url:'https://quality-crafted-profile.lovable.app/'},
  {name:'Rodina Sorour',photo:'assets/rodina-sorour.jpg',url:'https://rodina-portfolio.lovable.app/'},
  {name:'Mohamed Esmael',photo:'assets/mohamed-esmael.jpg',url:'https://bug-boundless-bytes.lovable.app/'},
  {name:'Mostafa AbdElrahman',photo:'assets/mostafa-abdelrahman.jpg',url:'https://my-pro-story-folio.lovable.app/'},
  {name:'Ahmad Ezzat',photo:'assets/ahmad-ezzat.jpg',url:'https://ae971499-ai.github.io/Ahmed-Ezzat/'},
  {name:'Ahmed Nader',photo:'assets/ahmed-nader.jpg',url:'https://acumen-archive-kit.lovable.app/'}
];
const USER_STORIES=['Login','Register','Home Page','Cart'];
/* Results stay null (shown as "pending") until real numbers are confirmed. Put a number 0-100 for progress bars. */
const STATS={stories:USER_STORIES.length,domains:null,aligned:100};
const RESULTS={cases:null,bugs:null,passed:null,failed:null};
const TYPES=[
 {id:'static',short:'Static',sub:'(User Story Review)',name:'Static (User Story Review)',
  bullets:['Review requirements and user stories for clarity and completeness','Validate acceptance criteria and business rules','Identify gaps, ambiguities, and inconsistencies early','Reduce rework and improve team alignment'],
  steps:[['User story review',null],['Requirement analysis',null],['Review findings',null]],
  icon:'<svg class="ico" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M30 14h40l20 20v26"/><path d="M30 14v92h30"/><path d="M46 52h30M46 70h20M46 88h12"/><path d="m66 96 14 14 28-30"/></svg>'},
 {id:'manual',short:'Manual',name:'Manual Testing',
  bullets:['Check the web experience against expected behavior','Write test cases from the user stories and execute them step by step','Report every defect with clear reproduction steps','Close with a test summary of what was covered'],
  steps:[['Test case creation',null],['Execution',null],['Bug reporting',null],['Test summary',null]],
  icon:'<svg class="ico" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M44 62V24a8 8 0 0 1 16 0v30"/><path d="M60 54V40a8 8 0 0 1 16 0v22"/><path d="M76 58a8 8 0 0 1 16 0v22c0 20-12 32-30 32s-26-8-34-22L22 74a8 8 0 0 1 14-8l8 10"/></svg>'},
 {id:'api',short:'API',name:'API Testing',
  bullets:['Compare requests and responses with the expected contract','Check status codes, payloads and error handling for each endpoint','Report mismatches between the contract and the real behavior','Summarize endpoint coverage at the end'],
  steps:[['Test case creation',null],['Execution',null],['Bug reporting',null],['Test summary',null]],
  icon:'<svg class="ico" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M42 30 14 60l28 30M78 30l28 30-28 30M68 22 52 98"/></svg>'},
 {id:'mobile',short:'Mobile APP',name:'Mobile App Testing',
  bullets:['Validate the experience through device-based execution','Cover screen sizes, orientation and touch interactions','Report defects found on the device with screenshots','Summarize results per device and flow'],
  steps:[['Test case creation',null],['Execution',null],['Bug reporting',null],['Test summary',null]],
  icon:'<svg class="ico" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="10" width="52" height="100" rx="10"/><path d="M52 94h16"/></svg>'},
 {id:'automation',short:'Automation',name:'Automation Testing',
  bullets:['Turn repeatable checks into executable scripts','Run the scripts against the application and collect the outcome','Keep a summary report of what passed and failed'],
  steps:[['Test script writing',null],['Execution',null],['Summary report',null]],
  icon:'<svg class="ico" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="34" width="68" height="56" rx="12"/><path d="M60 34V16M52 16h16M46 60h.1M74 60h.1M46 76h28"/></svg>'},
 {id:'database',short:'Database',name:'Database Testing',
  bullets:['Compare stored data with the expected application outcomes','Verify records are created, updated and removed correctly'],
  steps:[['Test case creation',null],['Execution',null]],
  icon:'<svg class="ico" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="60" cy="26" rx="38" ry="14"/><path d="M22 26v68c0 8 17 14 38 14s38-6 38-14V26M22 60c0 8 17 14 38 14s38-6 38-14"/></svg>'}
];

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const ext='<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const crown='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m3 7 5 5 4-7 4 7 5-5-2 12H5z"/></svg>';
const pend=v=>v==null?'—':v;
const pendNote=v=>v==null?'<span class="pending">Results pending</span>':'';
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const mlink=(m,i)=>m.url?`href="${m.url}" target="_blank" rel="noopener noreferrer"`:`href="#/portfolio/${i+1}"`;
function portrait(m,hue){return m.photo?`<img class="ph" src="${m.photo}" alt="${m.name}" loading="lazy">`:silhouette(m.name,hue)}
function silhouette(name,hue){
  return `<svg class="sil" viewBox="0 0 200 190" role="img" aria-label="${name} — temporary placeholder" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g${hue}" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="${hue}" stop-opacity=".35"/><stop offset="1" stop-color="#050810" stop-opacity="0"/></radialGradient></defs><rect width="200" height="190" fill="url(#g${hue})"/><circle cx="100" cy="74" r="30" fill="${hue}" opacity=".5"/><path d="M42 190c0-34 26-56 58-56s58 22 58 56z" fill="${hue}" opacity=".5"/><text x="100" y="82" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="24" fill="#05070d">${initials(name)}</text></svg>`;
}
const hues=['#c9f03a','#19f0e6','#2b6bff'];

/* ============ pages ============ */
const pages={
home(){
  return `<div class="wrap">
  <section class="hero">
    <div>
      <h1>NOVA_MART:</h1>
      <h2>Software Testing Showcase</h2>
      <div class="bar"></div>
      <p class="proj">Nova Mart Testing Portfolio</p>
      <div class="btns">
        <a class="btn" href="${APP_URL}" target="_blank" rel="noopener noreferrer">Visit Website ${ext}</a>
        <a class="btn lime" href="#/team">Team Members</a>
      </div>
      <p class="team-tag">By ${TEAM_NAME}</p>
    </div>
    <div class="laptop" aria-hidden="true">
      <div class="lid"><div class="screen">
        <div class="side"><i></i><i></i><i></i><i></i></div>
        <div class="w"><small>TEST EXECUTION</small><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div></div>
        <div class="w"><small>TEST COVERAGE</small><svg class="spark" viewBox="0 0 120 46" fill="none"><polyline points="2,38 16,30 28,34 42,24 56,28 70,18 84,22 98,12 118,6" stroke="#2b6bff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
        <div class="w"><small>DEFECTS</small><div class="bars"><i style="height:30%"></i><i style="height:45%"></i><i style="height:38%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></div></div>
        <div class="w"><small>ENVIRONMENTS</small><div class="ring lime"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div></div>
      </div></div>
      <div class="keyboard"></div>
    </div>
  </section>
  <section class="duration" aria-label="Project duration">
    <h3>PROJECT DURATION</h3>
    <div class="track">${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="wk"><i></i>WEEK ${n}</div>`).join('')}</div>
  </section></div>`;
},
overview(){
  const card=(c,val,label,note)=>`<div class="glass stat" style="--c:${c}"><strong>${val}</strong><span>${label}</span>${note?pendNote(null):''}</div>`;
  return `<div class="wrap">
  <div class="page-head"><div class="page-count">Nova Mart / Overview · 02 of 05</div><h1>About &amp; Scope</h1><div class="bar"></div></div>
  <section class="about">
    <div>
      <p class="lead">We are <b class="tn">${TEAM_NAME}</b>, a cross-functional quality team delivering end-to-end testing for Nova Mart to ensure a secure, reliable, and seamless user experience.</p>
      <div class="big">${pend(STATS.stories)}</div>
      <div class="big-sub">user stories including<span>${USER_STORIES.slice(0,-1).join(', ')}, and ${USER_STORIES[USER_STORIES.length-1]}</span></div>
    </div>
    <div class="stats">
      ${card('var(--cyan)',pend(STATS.stories),'user stories<br>in scope',STATS.stories==null)}
      ${card('var(--blue)',pend(STATS.domains),'key domains<br>covered',STATS.domains==null)}
      ${card('var(--coral)',STATS.aligned==null?'—':STATS.aligned+'%','scope aligned<br>to requirements',STATS.aligned==null)}
      ${card('var(--lime)','1','goal: deliver quality<br>with confidence',false)}
    </div>
  </section>
  <section class="levels">
    <h2>Test Levels &amp; Timing</h2><div class="bar"></div>
    <p>A 9-week plan across components, integration, and system validation.</p>
    <div class="lv-labels"><div><b style="color:var(--blue)">Component Testing</b><span>Weeks 1–3</span></div><div><b style="color:var(--lime)">Integration Testing</b><span>Weeks 4–6</span></div><div><b style="color:#26c9b8">System Testing</b><span>Weeks 7–9</span></div></div>
    <div class="lv-bar" role="img" aria-label="Component testing weeks 1 to 3, integration testing weeks 4 to 6, system testing weeks 7 to 9"><div></div><div></div><div></div></div>
    <div class="ticks">${[1,2,3,4,5,6,7,8,9].map(n=>`<span>${n}</span>`).join('')}</div>
    <div class="center"><a class="btn coral" href="${APP_URL}" target="_blank" rel="noopener noreferrer">Link to website ${ext}</a></div>
  </section></div>`;
},
testing(arg){
  const t=TYPES.find(x=>x.id===arg)||TYPES[0];
  return `<div class="wrap">
  <div class="page-head"><div class="page-count">Testing portfolio · 03 of 05</div><h1>Testing Types</h1><div class="bar"></div><p>Explore our testing categories. Select a tab to see what each type covers.</p></div>
  <div class="tabs" role="tablist" aria-label="Testing types">${TYPES.map(x=>`<a class="tab" role="tab" href="#/testing/${x.id}" aria-selected="${x.id===t.id}">${x.short}${x.sub?`<small>${x.sub}</small>`:''}</a>`).join('')}</div>
  <section class="panel" role="tabpanel">
    ${t.icon}
    <div><h2>${t.name}</h2><ul>${t.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div>
  </section>
  <section class="acts">
    <h3>Activities</h3><div class="bar" style="margin:12px 0 0"></div>
    <div class="acts-list">${t.steps.map(([n,v])=>`<div class="act"><span class="name">${n}</span><div class="meter" role="progressbar" aria-label="${n}" aria-valuemin="0" aria-valuemax="100" ${v==null?'':`aria-valuenow="${v}"`}><i style="--v:${v||0}%"></i></div><em>${v==null?'Pending':v+'%'}</em></div>`).join('')}</div>
    <div class="results">${[['Test cases','cases','var(--cyan)'],['Bugs','bugs','var(--coral)'],['Passed','passed','var(--lime)'],['Failed','failed','var(--blue)']].map(([l,k,c])=>`<div class="glass res" style="--c:${c}"><small>${l}</small><strong>${pend(RESULTS[k])}</strong><p>${RESULTS[k]==null?'Results pending':''}</p></div>`).join('')}</div>
    <div class="glass appcard" style="--c:var(--blue)"><div><small>Website under test</small><strong>${APP_URL}</strong></div><a class="btn blue" style="min-height:46px;padding:0 24px;font-size:15px" href="${APP_URL}" target="_blank" rel="noopener noreferrer">Open website ${ext}</a></div>
  </section></div>`;
},
team(){
  return `<div class="wrap">
  <div class="page-head"><div class="page-count">Nova Mart / The people · 04 of 05</div><h1>${TEAM_NAME}</h1><div class="bar"></div><p>Meet the people behind the testing portfolio. Select a member to open their portfolio.</p></div>
  <div class="team">${MEMBERS.map((m,i)=>`<article class="mem"><a class="pic" ${mlink(m,i)} aria-label="Open ${m.name} portfolio${m.url?' (opens in a new tab)':''}">${portrait(m,hues[i%3])}<span class="no">${String(i+1).padStart(2,'0')}</span>${m.leader?`<span class="badge">${crown}Team leader</span>`:''}<span class="arrow">${ext}</span></a><h3><a ${mlink(m,i)}>${m.name}</a></h3><p class="${m.leader?'lead':''}">${m.role||(m.url?'View portfolio':'Profile coming soon')}</p></article>`).join('')}</div></div>`;
},
portfolio(arg){
  const i=parseInt(arg,10)-1,m=MEMBERS[i];
  if(!m)return notFound();
  return `<div class="wrap"><a class="back" href="#/team"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-7-7 7 7 7"/></svg>Back to the team</a>
  <section class="pf"><div class="pic">${portrait(m,hues[i%3])}</div><div><div class="page-count">Individual portfolio · ${String(i+1).padStart(2,'0')}</div><h1>${m.name}</h1><p class="role">${m.role||'Profile coming soon'}</p><p style="color:var(--muted);margin:0">Software testing portfolio · ${TEAM_NAME}</p>
    ${m.url?`<div class="sec"><a class="btn" href="${m.url}" target="_blank" rel="noopener noreferrer">Open ${m.name.split(' ')[0]}’s portfolio ${ext}</a></div>`:`    <div class="sec"><h2>About</h2><div class="glass empty"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><p style="margin:0">Member biography awaiting submission.</p></div></div>
    <div class="sec"><h2>Projects &amp; contributions</h2><div class="glass empty"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><p style="margin:0">Portfolio projects and testing contributions awaiting submission.</p></div></div>
`}
  </div></section></div>`;
},
'thank-you'(){
  return `<div class="wrap">
  <section class="ty">
    <div><div class="page-count">And that's our showcase · 05 of 05</div><h1>Thank You<br>for Exploring<b>NOVA_MART</b></h1>
      <p class="sub">We appreciate your time and interest. Let’s build quality with confidence.</p>
      <p class="ar" dir="rtl">شكرًا ليكم… وعم رفاعي بيسلّم عليكم.</p></div>
    <figure class="refai"><img src="assets/refai-el-desouky.jpg" alt="عم رفاعي الدسوقي — صورة مولّدة بالذكاء الاصطناعي" width="1000" height="747"><figcaption dir="rtl">عم رفاعي الدسوقي · «أنا رفاعي الدسوقي.. تسمع عني؟» · صورة مولّدة بالذكاء الاصطناعي</figcaption></figure>
  </section>
  <section class="cta3">
    <a class="glass" style="--c:var(--lime)" href="#/team"><b>Contact Us</b><span>Reach out to<br>our team</span></a>
    <a class="glass" style="--c:var(--cyan)" href="#/testing"><b>Explore Testing</b><span>See the testing<br>in action</span></a>
    <a class="glass" style="--c:var(--blue)" href="${APP_URL}" target="_blank" rel="noopener noreferrer"><b>Visit Website</b><span>Learn more about<br>Nova Mart</span></a>
  </section></div>`;
}
};
function notFound(){return `<div class="wrap"><div class="page-head"><h1>Page not found</h1><div class="bar"></div><p>That page doesn’t exist. Head back to the <a href="#/" style="color:var(--cyan)">home page</a>.</p></div></div>`}

/* ============ router ============ */
const TITLES={home:'Software Testing Showcase',overview:'Overview',testing:'Testing Types',team:'The team',portfolio:'Portfolio','thank-you':'Thank you'};
function route(){
  const [p0,arg]=location.hash.replace(/^#\/?/,'').split('/');
  const p=p0||'home';
  const view=pages[p]?pages[p](arg):notFound();
  const app=$('#app');
  app.innerHTML=view;
  const key=p==='portfolio'?'team':p;
  document.querySelectorAll('nav.main a').forEach(a=>{a.dataset.p===key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  let t=TITLES[p]||'Not found';
  if(p==='portfolio'&&MEMBERS[parseInt(arg,10)-1])t=MEMBERS[parseInt(arg,10)-1].name;
  document.title=(p==='home'?'NOVA_MART — ':t+' — NOVA_MART — ')+(p==='home'?t:TEAM_NAME);
  $('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
  if(!(p==='testing'&&arg)){window.scrollTo(0,0)}
  app.focus({preventScroll:true});
}
addEventListener('hashchange',route);route();
$('#burger').addEventListener('click',()=>{const o=$('#nav').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)});

/* ============ music (user-triggered only, never autoplays) ============ */
const AUDIO_SRC='assets/music.mp3';
let bgm=null;
$('#music').addEventListener('click',async()=>{
  const b=$('#music');
  try{
    if(!bgm){bgm=new Audio(AUDIO_SRC);bgm.loop=true;bgm.volume=.5}
    const on=bgm.paused;
    if(on)await bgm.play();else bgm.pause();
    b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Pause music':'Play music');b.title=on?'Pause music':'Play music';$('#mstate').textContent=on?'on':'off';
  }catch(e){$('#mstate').textContent='unavailable'}
});
</script>
</body>
</html>
